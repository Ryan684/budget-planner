[project]
name = "budget-planner-backend"
version = "0.1.0"
description = "Family Budget Planner — FastAPI backend (Phase 1 data layer)"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    # Pinned: 3.6.0 cannot import unmutated modules from its copied source tree,
    # and MUTANTS.md records results from this version.
    "mutmut==3.5.0",
    "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "main",
    "config",
    "database",
    "models",
    "schemas",
    "crud",
    "budget",
    "carry_forward",
    "claude_context",
    "claude_tools",
    "claude_client",
    "current_month",
    "backup_status",
]
packages = ["routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ".." lets the suite run inside mutmut's copied "mutants/" tree, which holds only
# the mutated modules: "." resolves those first, ".." supplies the rest (models,
# database, config, schemas). Outside mutants/ it resolves to the repo root, which
# has no importable modules, so normal runs are unaffected.
pythonpath = [".", ".."]

[tool.mutmut]
# mutmut 3.x expects a list of paths. Scope mutation to the core logic
# modules (calculations, carry-forward, amendment logging) — not routers,
# schemas, or boilerplate.
paths_to_mutate = [
    "budget.py",
    "carry_forward.py",
    "crud.py",
    "claude_context.py",
    "claude_tools.py",
    "claude_client.py",
    "backup.py",
    "current_month.py",
    "backup_status.py",
    "routers/auth.py",
    "routers/system.py",
    "routers/deps.py",
]
tests_dir = ["tests/"]
