[project]
name = "budget-planner-backend"
version = "0.1.0"
description = "Family Budget Planner — FastAPI backend (Phase 1 data layer)"
requires-python = ">=3.14"
# Floors, not exact pins — the exact tested versions live in requirements.lock,
# which is what the Pi installs from (runtime deps only; dev tooling is installed
# from the dev extra on development machines). Regenerate the lock after changing
# anything below:
#   uv pip compile pyproject.toml --universal --python-version 3.14 -o requirements.lock
dependencies = [
    "fastapi>=0.140.7",
    # Pinned explicitly rather than left to fastapi, which only asks for
    # starlette>=0.46.0 — a range that still admits every version affected by
    # CVE-2026-48710 (host-header auth bypass, fixed in 1.0.1). Matches the floor
    # family-dashboard sets for the same reason.
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2",
    "pydantic>=2",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.2",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    # Pinned: 3.6.0 cannot import unmutated modules from its copied source tree,
    # and MUTANTS.md records results from this version.
    "mutmut==3.5.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "main",
    "config",
    "database",
    "models",
    "schemas",
    "crud",
    "budget",
    "carry_forward",
    "claude_context",
    "claude_tools",
    "claude_client",
    "current_month",
    "backup_status",
]
packages = ["routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ".." lets the suite run inside mutmut's copied "mutants/" tree, which holds only
# the mutated modules: "." resolves those first, ".." supplies the rest (models,
# database, config, schemas). Outside mutants/ it resolves to the repo root, which
# has no importable modules, so normal runs are unaffected.
pythonpath = [".", ".."]

[tool.mutmut]
# mutmut 3.x expects a list of paths. Scope mutation to the core logic
# modules (calculations, carry-forward, amendment logging) — not routers,
# schemas, or boilerplate.
paths_to_mutate = [
    "budget.py",
    "carry_forward.py",
    "crud.py",
    "claude_context.py",
    "claude_tools.py",
    "claude_client.py",
    "backup.py",
    "current_month.py",
    "backup_status.py",
    "routers/auth.py",
    "routers/system.py",
    "routers/deps.py",
]
tests_dir = ["tests/"]
