<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Budget Planner — Screen Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app/app.css" />
<style>
  html, body { margin: 0; height: 100%; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/data.js"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="frames/design-canvas.jsx"></script>
<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/components.jsx"></script>
<script type="text/babel" src="app/chrome.jsx"></script>
<script type="text/babel" src="app/screens-core.jsx"></script>
<script type="text/babel" src="app/screens-bills-accounts.jsx"></script>
<script type="text/babel" src="app/screens-claude.jsx"></script>
<script type="text/babel" src="app/app.jsx"></script>

<script type="text/babel" data-presets="react">
function Frame({ screen, month }) {
  return (
    <IOSDevice dark>
      <App initialScreen={screen} initialMonth={month} />
    </IOSDevice>
  );
}
const W = 402, H = 874;

function Overview() {
  return (
    <DesignCanvas>
      <DCSection id="primary" title="Primary tabs" subtitle="The four bottom-bar destinations">
        <DCArtboard id="dash" label="Dashboard" width={W} height={H}><Frame screen="dashboard" /></DCArtboard>
        <DCArtboard id="bills" label="Bills · grouped by category" width={W} height={H}><Frame screen="bills" /></DCArtboard>
        <DCArtboard id="accounts" label="Accounts · recorded balances" width={W} height={H}><Frame screen="accounts" /></DCArtboard>
        <DCArtboard id="claude" label="Claude assistant" width={W} height={H}><Frame screen="claude" /></DCArtboard>
      </DCSection>

      <DCSection id="secondary" title="Secondary screens & flows" subtitle="Reached from the Dashboard">
        <DCArtboard id="income" label="Income" width={W} height={H}><Frame screen="income" /></DCArtboard>
        <DCArtboard id="amend" label="Amendments log" width={W} height={H}><Frame screen="amendments" /></DCArtboard>
        <DCArtboard id="months" label="Month management" width={W} height={H}><Frame screen="months" /></DCArtboard>
        <DCArtboard id="create" label="Create month · carry-forward" width={W} height={H}><Frame screen="create" /></DCArtboard>
      </DCSection>

      <DCSection id="states" title="Key states" subtitle="Empty start & read-only past month">
        <DCArtboard id="empty" label="Empty state · no month yet" width={W} height={H}><Frame screen="empty" /></DCArtboard>
        <DCArtboard id="readonly" label="Past month · read-only (April)" width={W} height={H}><Frame screen="dashboard" month="2026-04" /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Overview />);
</script>
</body>
</html>
