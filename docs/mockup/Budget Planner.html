<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Family Budget Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app/app.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(120% 90% at 50% 0%, #15203a 0%, #0b1018 60%, #080b12 100%); overflow: hidden; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/data.js"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/components.jsx"></script>
<script type="text/babel" src="app/chrome.jsx"></script>
<script type="text/babel" src="app/screens-core.jsx"></script>
<script type="text/babel" src="app/screens-bills-accounts.jsx"></script>
<script type="text/babel" src="app/screens-claude.jsx"></script>
<script type="text/babel" src="app/app.jsx"></script>

<script type="text/babel" data-presets="react">
function Stage() {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const fit = () => {
      const padW = 28, padH = 28;
      const s = Math.min((window.innerWidth - padW) / 402, (window.innerHeight - padH) / 874);
      setScale(Math.max(0.3, Math.min(s, 1.12)));
    };
    fit();
    window.addEventListener("resize", fit);
    return () => window.removeEventListener("resize", fit);
  }, []);
  return (
    <div style={{ position: "fixed", inset: 0, display: "grid", placeItems: "center" }}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: "center center" }}>
        <IOSDevice dark>
          <App initialScreen="dashboard" />
        </IOSDevice>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Stage />);
</script>
</body>
</html>
